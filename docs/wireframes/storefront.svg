<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3000" viewBox="0 0 2400 3000" role="img" aria-labelledby="title desc">
  <title id="title">TechStore storefront wireframes</title>
  <desc id="desc">Low-fidelity wireframes for home, product listing, product detail, cart, checkout, and authentication screens.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .canvas { fill: #edf1f5; }
      .screen { fill: #ffffff; stroke: #263349; stroke-width: 3; }
      .chrome { fill: #f6f8fa; stroke: #9aa6b6; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #8a97a8; stroke-width: 2; }
      .soft { fill: #eef2f6; stroke: #a3adba; stroke-width: 2; }
      .image { fill: #dce3ea; stroke: #7b8898; stroke-width: 2; }
      .button { fill: #255fc2; }
      .button-secondary { fill: #ffffff; stroke: #255fc2; stroke-width: 2; }
      .accent { fill: #dce8fb; stroke: #255fc2; stroke-width: 2; }
      .line { stroke: #748196; stroke-width: 2; }
      .strong { font-size: 24px; font-weight: 700; }
      .heading { font-size: 32px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #526176; }
      .inverse { fill: #ffffff; font-size: 17px; font-weight: 700; }
      .screen-title { font-size: 27px; font-weight: 700; fill: #152c52; }
    </style>
    <g id="store-header">
      <rect class="chrome" x="0" y="0" width="1120" height="72" />
      <text class="strong" x="30" y="44">TECHSTORE</text>
      <text class="body" x="220" y="43">Trang chủ</text>
      <text class="body" x="320" y="43">Sản phẩm</text>
      <rect class="panel" x="450" y="18" width="300" height="38" rx="6" />
      <text class="small" x="470" y="43">Tìm điện thoại, phụ kiện...</text>
      <text class="body" x="785" y="43">Tài khoản</text>
      <text class="body" x="910" y="43">Giỏ hàng (2)</text>
    </g>
    <g id="product-card">
      <rect class="panel" x="0" y="0" width="220" height="245" rx="8" />
      <rect class="image" x="18" y="18" width="184" height="125" rx="5" />
      <text class="small" x="72" y="87">ẢNH SP</text>
      <line class="line" x1="18" y1="165" x2="188" y2="165" />
      <line class="line" x1="18" y1="183" x2="140" y2="183" />
      <text class="label" x="18" y="221">00.000.000đ</text>
    </g>
  </defs>

  <rect class="canvas" width="2400" height="3000" />
  <text x="60" y="42" class="heading">TECHSTORE · WIREFRAME STOREFRONT</text>

  <!-- Home -->
  <g transform="translate(60 100)">
    <text class="screen-title" x="0" y="-18">01 · Trang chủ  /</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <use href="#store-header" />
    <rect class="accent" x="32" y="98" width="1056" height="220" rx="10" />
    <text class="heading" x="72" y="160">Ưu đãi công nghệ nổi bật</text>
    <line class="line" x1="72" y1="190" x2="445" y2="190" />
    <line class="line" x1="72" y1="215" x2="385" y2="215" />
    <rect class="button" x="72" y="248" width="165" height="46" rx="6" />
    <text class="inverse" x="101" y="277">Xem sản phẩm</text>
    <rect class="image" x="650" y="122" width="390" height="172" rx="8" />
    <text class="label" x="790" y="214">HERO IMAGE</text>
    <text class="label" x="32" y="365">Danh mục nổi bật</text>
    <g transform="translate(32 390)">
      <rect class="soft" width="185" height="72" rx="8" /><text class="body" x="54" y="43">Điện thoại</text>
      <rect class="soft" x="205" width="185" height="72" rx="8" /><text class="body" x="263" y="43">Laptop</text>
      <rect class="soft" x="410" width="185" height="72" rx="8" /><text class="body" x="466" y="43">Phụ kiện</text>
      <rect class="soft" x="615" width="185" height="72" rx="8" /><text class="body" x="667" y="43">Âm thanh</text>
      <rect class="soft" x="820" width="204" height="72" rx="8" /><text class="body" x="872" y="43">Đồng hồ</text>
    </g>
    <text class="label" x="32" y="512">Sản phẩm bán chạy</text>
    <use href="#product-card" x="32" y="535" />
    <use href="#product-card" x="305" y="535" />
    <use href="#product-card" x="578" y="535" />
    <use href="#product-card" x="851" y="535" />
    <rect class="chrome" x="0" y="824" width="1120" height="56" />
    <text class="small" x="32" y="858">Hỗ trợ · Chính sách · Liên hệ</text>
  </g>

  <!-- Catalog -->
  <g transform="translate(1220 100)">
    <text class="screen-title" x="0" y="-18">02 · Danh sách sản phẩm  /products</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <use href="#store-header" />
    <text class="small" x="32" y="108">Trang chủ / Sản phẩm</text>
    <text class="heading" x="32" y="154">Điện thoại</text>
    <rect class="panel" x="32" y="184" width="230" height="630" rx="8" />
    <text class="label" x="52" y="220">Bộ lọc</text>
    <text class="body" x="52" y="265">Khoảng giá</text>
    <rect class="soft" x="52" y="282" width="190" height="36" rx="4" />
    <text class="body" x="52" y="355">Thương hiệu</text>
    <text class="body" x="58" y="388">□ Apple</text><text class="body" x="58" y="420">□ Samsung</text><text class="body" x="58" y="452">□ Xiaomi</text>
    <text class="body" x="52" y="500">Dung lượng</text>
    <text class="body" x="58" y="533">□ 128 GB</text><text class="body" x="58" y="565">□ 256 GB</text><text class="body" x="58" y="597">□ 512 GB</text>
    <rect class="button" x="52" y="650" width="190" height="42" rx="5" /><text class="inverse" x="112" y="677">Áp dụng</text>
    <text class="small" x="52" y="725">Xóa bộ lọc</text>
    <text class="body" x="294" y="211">24 sản phẩm</text>
    <rect class="panel" x="830" y="184" width="258" height="42" rx="5" /><text class="small" x="850" y="211">Sắp xếp: Nổi bật⌄</text>
    <g transform="translate(294 250) scale(.86)"><use href="#product-card" /><use href="#product-card" x="285" /><use href="#product-card" x="570" /></g>
    <g transform="translate(294 490) scale(.86)"><use href="#product-card" /><use href="#product-card" x="285" /><use href="#product-card" x="570" /></g>
    <g transform="translate(600 796)"><rect class="soft" width="42" height="34" rx="4" /><text class="body" x="16" y="23">1</text><text class="body" x="62" y="23">2</text><text class="body" x="104" y="23">3</text><text class="body" x="147" y="23">›</text></g>
  </g>

  <!-- Product detail -->
  <g transform="translate(60 1080)">
    <text class="screen-title" x="0" y="-18">03 · Chi tiết sản phẩm  /products/:slug</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <use href="#store-header" />
    <text class="small" x="32" y="108">Trang chủ / Điện thoại / Tên sản phẩm</text>
    <rect class="image" x="32" y="138" width="470" height="390" rx="8" />
    <text class="label" x="200" y="340">ẢNH SẢN PHẨM</text>
    <g transform="translate(32 550)"><rect class="image" width="96" height="76" /><rect class="image" x="116" width="96" height="76" /><rect class="image" x="232" width="96" height="76" /><rect class="image" x="348" width="96" height="76" /></g>
    <text class="heading" x="550" y="155">Tên điện thoại</text>
    <text class="small" x="550" y="188">★★★★★ 4.8 · 128 đánh giá · Còn hàng</text>
    <text class="heading" x="550" y="235">00.000.000đ</text>
    <text class="body" x="550" y="280">Dung lượng</text>
    <rect class="accent" x="550" y="298" width="112" height="44" rx="5" /><text class="body" x="577" y="326">128 GB</text>
    <rect class="panel" x="678" y="298" width="112" height="44" rx="5" /><text class="body" x="705" y="326">256 GB</text>
    <text class="body" x="550" y="385">Màu sắc</text>
    <circle class="accent" cx="574" cy="420" r="18" /><circle class="soft" cx="626" cy="420" r="18" /><circle class="panel" cx="678" cy="420" r="18" />
    <rect class="button" x="550" y="470" width="340" height="52" rx="6" /><text class="inverse" x="656" y="503">Thêm vào giỏ</text>
    <rect class="button-secondary" x="906" y="470" width="150" height="52" rx="6" /><text class="body" x="942" y="503">Mua ngay</text>
    <rect class="soft" x="550" y="550" width="506" height="76" rx="6" /><text class="body" x="570" y="580">✓ Giao hàng toàn quốc</text><text class="body" x="570" y="608">✓ Đổi trả theo chính sách</text>
    <rect class="panel" x="32" y="665" width="1024" height="164" rx="8" />
    <text class="label" x="54" y="704">Thông số &amp; mô tả</text>
    <line class="line" x1="54" y1="730" x2="495" y2="730" /><line class="line" x1="54" y1="756" x2="430" y2="756" /><line class="line" x1="550" y1="730" x2="1010" y2="730" /><line class="line" x1="550" y1="756" x2="945" y2="756" />
  </g>

  <!-- Cart -->
  <g transform="translate(1220 1080)">
    <text class="screen-title" x="0" y="-18">04 · Giỏ hàng  /cart</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <use href="#store-header" />
    <text class="heading" x="32" y="135">Giỏ hàng của bạn</text>
    <text class="small" x="32" y="165">2 sản phẩm</text>
    <rect class="panel" x="32" y="195" width="700" height="245" rx="8" />
    <rect class="image" x="52" y="220" width="140" height="140" rx="5" /><text class="small" x="91" y="296">ẢNH SP</text>
    <text class="label" x="220" y="247">Tên sản phẩm thứ nhất</text><text class="body" x="220" y="280">Màu · 128 GB</text><text class="label" x="220" y="325">00.000.000đ</text>
    <rect class="soft" x="570" y="250" width="130" height="40" rx="5" /><text class="body" x="590" y="276">−  1  +</text><text class="small" x="620" y="336">Xóa</text>
    <line class="line" x1="52" y1="382" x2="710" y2="382" />
    <text class="body" x="52" y="416">Sản phẩm thứ hai · màu · dung lượng</text>
    <rect class="panel" x="32" y="468" width="700" height="100" rx="8" /><text class="label" x="52" y="503">Mã giảm giá</text><rect class="soft" x="52" y="520" width="430" height="34" rx="4" /><rect class="button-secondary" x="500" y="520" width="120" height="34" rx="4" /><text class="small" x="526" y="542">Áp dụng</text>
    <rect class="panel" x="770" y="195" width="318" height="373" rx="8" />
    <text class="label" x="794" y="235">Tóm tắt đơn hàng</text>
    <text class="body" x="794" y="280">Tạm tính</text><text class="body" x="980" y="280">00.000đ</text>
    <text class="body" x="794" y="320">Giảm giá</text><text class="body" x="995" y="320">−0đ</text>
    <text class="body" x="794" y="360">Phí vận chuyển</text><text class="body" x="990" y="360">Dự kiến</text>
    <line class="line" x1="794" y1="392" x2="1064" y2="392" />
    <text class="label" x="794" y="430">Tổng cộng</text><text class="label" x="952" y="430">00.000đ</text>
    <rect class="button" x="794" y="470" width="270" height="54" rx="6" /><text class="inverse" x="862" y="503">Thanh toán</text>
    <rect class="button-secondary" x="32" y="610" width="220" height="46" rx="6" /><text class="body" x="68" y="639">← Tiếp tục mua</text>
    <rect class="soft" x="32" y="700" width="1056" height="100" rx="8" /><text class="label" x="58" y="742">Gợi ý sản phẩm liên quan</text><line class="line" x1="58" y1="768" x2="900" y2="768" />
  </g>

  <!-- Checkout -->
  <g transform="translate(60 2060)">
    <text class="screen-title" x="0" y="-18">05 · Checkout  /checkout</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <use href="#store-header" />
    <text class="heading" x="32" y="130">Thanh toán</text>
    <g transform="translate(32 156)"><circle class="button" cx="20" cy="20" r="20" /><text class="inverse" x="15" y="27">1</text><line class="line" x1="42" y1="20" x2="245" y2="20" /><circle class="accent" cx="270" cy="20" r="20" /><text class="body" x="265" y="27">2</text><line class="line" x1="292" y1="20" x2="495" y2="20" /><circle class="soft" cx="520" cy="20" r="20" /><text class="body" x="515" y="27">3</text><text class="small" x="0" y="60">Thông tin</text><text class="small" x="230" y="60">Thanh toán</text><text class="small" x="490" y="60">Hoàn tất</text></g>
    <rect class="panel" x="32" y="240" width="700" height="250" rx="8" />
    <text class="label" x="52" y="276">Địa chỉ giao hàng</text>
    <rect class="soft" x="52" y="300" width="310" height="42" rx="4" /><text class="small" x="66" y="326">Họ và tên *</text>
    <rect class="soft" x="382" y="300" width="330" height="42" rx="4" /><text class="small" x="396" y="326">Số điện thoại *</text>
    <rect class="soft" x="52" y="360" width="660" height="42" rx="4" /><text class="small" x="66" y="386">Địa chỉ chi tiết *</text>
    <rect class="soft" x="52" y="420" width="205" height="42" rx="4" /><rect class="soft" x="277" y="420" width="205" height="42" rx="4" /><rect class="soft" x="502" y="420" width="210" height="42" rx="4" />
    <rect class="panel" x="32" y="515" width="700" height="225" rx="8" />
    <text class="label" x="52" y="552">Vận chuyển &amp; thanh toán</text>
    <rect class="accent" x="52" y="575" width="310" height="56" rx="5" /><text class="body" x="70" y="608">◉ Giao tiêu chuẩn · 30.000đ</text>
    <rect class="panel" x="382" y="575" width="330" height="56" rx="5" /><text class="body" x="400" y="608">○ Giao nhanh · 50.000đ</text>
    <text class="body" x="52" y="670">◉ Thanh toán khi nhận hàng</text><text class="body" x="382" y="670">○ Chuyển khoản / Cổng thanh toán</text>
    <rect class="panel" x="770" y="240" width="318" height="500" rx="8" />
    <text class="label" x="792" y="278">Đơn hàng (2)</text>
    <rect class="image" x="792" y="302" width="70" height="70" /><text class="small" x="880" y="326">Sản phẩm 1 × 1</text><text class="small" x="880" y="352">00.000đ</text>
    <rect class="image" x="792" y="390" width="70" height="70" /><text class="small" x="880" y="414">Sản phẩm 2 × 1</text><text class="small" x="880" y="440">00.000đ</text>
    <line class="line" x1="792" y1="490" x2="1064" y2="490" />
    <text class="body" x="792" y="530">Tổng thanh toán</text><text class="label" x="954" y="530">00.000đ</text>
    <rect class="button" x="792" y="570" width="272" height="54" rx="6" /><text class="inverse" x="864" y="603">Đặt hàng</text>
    <text class="small" x="792" y="658">Bằng việc đặt hàng, bạn đồng ý</text><text class="small" x="792" y="680">với điều khoản mua hàng.</text>
  </g>

  <!-- Authentication -->
  <g transform="translate(1220 2060)">
    <text class="screen-title" x="0" y="-18">06 · Đăng nhập / Đăng ký  /login · /register</text>
    <rect class="screen" width="1120" height="880" rx="10" />
    <rect class="chrome" width="1120" height="72" /><text class="strong" x="34" y="44">TECHSTORE</text><text class="small" x="930" y="42">← Về trang chủ</text>
    <rect class="accent" x="32" y="110" width="440" height="700" rx="10" />
    <text class="heading" x="72" y="185">Mua sắm dễ dàng</text>
    <text class="body" x="72" y="225">Đăng nhập để theo dõi đơn hàng,</text><text class="body" x="72" y="252">lưu địa chỉ và nhận ưu đãi.</text>
    <rect class="image" x="72" y="310" width="360" height="250" rx="8" /><text class="label" x="180" y="445">ILLUSTRATION</text>
    <text class="body" x="72" y="630">✓ Thanh toán nhanh hơn</text><text class="body" x="72" y="670">✓ Quản lý đơn hàng</text><text class="body" x="72" y="710">✓ Ưu đãi dành riêng</text>
    <rect class="panel" x="520" y="110" width="568" height="700" rx="10" />
    <rect class="accent" x="550" y="140" width="230" height="46" rx="6" /><text class="label" x="610" y="170">Đăng nhập</text>
    <rect class="soft" x="798" y="140" width="260" height="46" rx="6" /><text class="label" x="868" y="170">Đăng ký</text>
    <text class="label" x="550" y="235">Email</text><rect class="soft" x="550" y="252" width="508" height="48" rx="5" /><text class="small" x="568" y="282">email@example.com</text>
    <text class="label" x="550" y="348">Mật khẩu</text><rect class="soft" x="550" y="365" width="508" height="48" rx="5" /><text class="small" x="568" y="395">••••••••                         Hiện</text>
    <text class="small" x="550" y="450">□ Ghi nhớ đăng nhập</text><text class="small" x="905" y="450">Quên mật khẩu?</text>
    <rect class="button" x="550" y="486" width="508" height="52" rx="6" /><text class="inverse" x="755" y="519">Đăng nhập</text>
    <line class="line" x1="550" y1="585" x2="758" y2="585" /><text class="small" x="778" y="590">hoặc</text><line class="line" x1="830" y1="585" x2="1058" y2="585" />
    <rect class="button-secondary" x="550" y="620" width="508" height="48" rx="6" /><text class="body" x="724" y="651">Google / OAuth</text>
    <text class="body" x="662" y="730">Chưa có tài khoản?</text><text class="label" x="835" y="730">Đăng ký ngay</text>
    <text class="small" x="550" y="775">Tab đăng ký: Họ tên · Email · SĐT · Mật khẩu · Xác nhận</text>
  </g>
</svg>
