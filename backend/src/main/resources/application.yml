spring:
  application:
    name: techstore-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  brand:
    name: ${BRAND_NAME:Đăng Tùng Mobile}
    industry: ${BRAND_INDUSTRY:Kinh doanh phụ kiện điện thoại.}
    address: ${BRAND_ADDRESS:Xóm Lê Lợi, Thôn Cập Thượng, Phường Nam Đồng, TP Hải Phòng}
    contact-phone: ${BRAND_CONTACT_PHONE:0867116863}
    contact-email: ${BRAND_CONTACT_EMAIL:hoanghd064@gmail.com}
    # Do not publish these until the store provides the relevant details.
    opening-hours: ${BRAND_OPENING_HOURS:}
    zalo-url: ${BRAND_ZALO_URL:}
    social-url: ${BRAND_SOCIAL_URL:}
    map-url: ${BRAND_MAP_URL:}
    warranty-policy-url: ${BRAND_WARRANTY_POLICY_URL:}
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
    email-from: ${MAIL_FROM:no-reply@techstore.local}
  upload:
    dir: ${UPLOAD_DIR:uploads/products}
    base-dir: ${UPLOAD_BASE_DIR:uploads}
