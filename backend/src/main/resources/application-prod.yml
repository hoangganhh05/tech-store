spring:
  config:
    activate:
      on-profile: prod
  mail:
    # No default: production must not pretend to send reset links without SMTP.
    host: ${MAIL_HOST}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.techstore: INFO

app:
  storage:
    r2:
      endpoint: ${R2_ENDPOINT}
      region: ${R2_REGION:auto}
      bucket: ${R2_BUCKET_NAME}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      public-base-url: ${R2_PUBLIC_BASE_URL}
  cors:
    # Production must explicitly provide the trusted frontend origin(s).
    # Multiple origins may be comma-separated; wildcard origins are not used.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  password-reset:
    # No defaults: a public reset link and sender address must be explicit in production.
    frontend-base-url: ${PASSWORD_RESET_FRONTEND_URL}
    email-from: ${MAIL_FROM}
